name: commit-lint

on:
  pull_request:

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" | grep -Ev "^[0-9a-f]+ $pattern" || true)
          if [ -n "$bad" ]; then
            echo "Commits not following Conventional Commits (https://www.conventionalcommits.org):"
            echo "$bad"
            exit 1
          fi
